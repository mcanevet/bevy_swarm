[workspace]
resolver = "2"
members = [
    ".",
    "fixtures/spinner",
    "fixtures/walker",
    "fixtures/spawner",
    "fixtures/turn_based",
    "fixtures/regression_pair",
    "tests/fixture-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcanevet/bevy_swarm"
homepage = "https://github.com/mcanevet/bevy_swarm"

[workspace.dependencies]
bevy = { version = "0.20.0-rc.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "bevy_swarm"
version.workspace = true
rust-version = "1.97"
license.workspace = true
edition.workspace = true
description = "ECS-native headless playtesting harness for Bevy games — contract-driven bots, oracles, and crash minimization"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bevy_swarm"
readme = "README.md"
keywords = ["bevy", "gamedev", "testing", "playtesting", "ecs"]
categories = ["game-development", "development-tools::testing"]

[dependencies]
bevy = { workspace = true, features = [
    "bevy_picking",
    "bevy_window",
    "bevy_camera",
    "bevy_log",
    "debug",
    "reflect_auto_register",
] }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
agent = ["bevy/bevy_remote", "bevy/bevy_render"]
gamepad = ["bevy/gamepad"]
render = ["bevy/bevy_render"]

[badges]
maintenance = { status = "actively-developed" }
