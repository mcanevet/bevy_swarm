[workspace]
resolver = "2"
members = [
    ".",
    "fixtures/spinner",
    "fixtures/walker",
    "fixtures/spawner",
    "fixtures/turn_based",
    "fixtures/regression_pair",
    "tests/fixture-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcanevet/bevy_swarm"
homepage = "https://github.com/mcanevet/bevy_swarm"

[workspace.dependencies]
bevy = { version = "0.20.0-rc.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[package]
name = "bevy_swarm"
version.workspace = true
rust-version = "1.97"
license.workspace = true
edition.workspace = true
description = "ECS-native headless playtesting harness for Bevy games — contract-driven bots, oracles, and crash minimization"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bevy_swarm"
readme = "README.md"
keywords = ["bevy", "gamedev", "testing", "playtesting", "ecs"]
categories = ["game-development", "development-tools::testing"]

[dependencies]
# Deterministic entropy backend (optional, enabled by CLI)
getrandom04 = { package = "getrandom", version = "0.4", optional = true }
bevy = { workspace = true, features = [
    "bevy_picking",
    "bevy_window",
    "bevy_camera",
    "bevy_log",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_audio",
    "bevy_gilrs",
    "bevy_render",
    "debug",
    "reflect_auto_register",
] }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
deterministic-entropy = ["getrandom04"]
agent = ["bevy/bevy_remote", "bevy/bevy_render"]
gamepad = ["bevy/gamepad"]
render = ["bevy/bevy_render"]

[dev-dependencies]
serial_test = "3"
# Z14 entropy tests: uuid uses getrandom 0.4 for v4 generation
uuid = { version = "1", features = ["v4", "rng-getrandom"] }
# rand acceptance test (ThreadRng via getrandom hook)
rand = "0.10"
# FX2: full draft-2020-12 validation of reports against the schema
jsonschema = { version = "0.30", default-features = false }
fixture-turn-based = { package = "fixture_turn_based", path = "fixtures/turn_based" }
fixture-walker = { package = "fixture_walker", path = "fixtures/walker" }

[badges]
maintenance = { status = "actively-developed" }
