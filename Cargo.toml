[workspace]
resolver = "2"
members = [
    ".",
    "fixtures/spinner",
    "fixtures/walker",
    "fixtures/spawner",
    "fixtures/turn_based",
    "fixtures/regression_pair",
    "fixtures/lone",
    "tests/fixture-runner",
    "bevy_swarm_cli",
]

# Z10: CLI test-fixture crates are standalone workspaces driven by the
# CLI's own tests; building them as members would pull bevy
# dev-deps into workspace-wide feature unification.
exclude = ["bevy_swarm_cli/tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcanevet/bevy_swarm"
homepage = "https://github.com/mcanevet/bevy_swarm"

[workspace.dependencies]
bevy = { version = "0.20.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[package]
name = "bevy_swarm"
version.workspace = true
rust-version = "1.97"
license.workspace = true
edition.workspace = true
description = "ECS-native headless playtesting harness for Bevy games — contract-driven bots, oracles, and crash minimization"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bevy_swarm"
readme = "README.md"
keywords = ["bevy", "gamedev", "testing", "playtesting", "ecs"]
categories = ["game-development", "development-tools::testing"]
# Keep the published crate lean: repo-only tooling must not ship to
# crates.io.
exclude = [
    ".beads/",
    ".github/",
    ".cursor/",
    ".claude/",
    ".codex/",
    ".agents/",
    ".beads.gate.lock",
]

[dependencies]
# Deterministic entropy backend (optional, enabled by CLI)
getrandom04 = { package = "getrandom", version = "0.4", optional = true }
bevy = { workspace = true, features = [
    "bevy_picking",
    "ui_picking",
    "sprite_picking",
    "bevy_window",
    "bevy_camera",
    "bevy_ui",
    "bevy_log",
    "debug",
    "reflect_auto_register",
] }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
schemars = "1.2.3"
# RF9: optional passthrough deps for headless platform plugin detection.
# A consumer building a winit-enabled game with bevy_swarm
# default-features=false enables `passthrough-winit` so
# headless_platform() can reference (and disable) WinitPlugin.
bevy_winit = { version = "0.20", optional = true }
bevy_render = { version = "0.20", optional = true, default-features = false }
bevy_audio = { version = "0.20", optional = true, default-features = false }
bevy_gilrs = { version = "0.20", optional = true, default-features = false }
# Z10: for disabling render-family/ui-widget plugins in headless_platform.
bevy_ui_widgets = { version = "0.20", optional = true, default-features = false }

[features]
default = ["render", "audio", "gamepad"]
render = [
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_image",
    "bevy/bevy_mesh",
    "bevy/bevy_camera",
    "bevy/bevy_light",
    "bevy/bevy_post_process",
    "bevy/bevy_anti_alias",
    "bevy/bevy_sprite",
    "bevy/bevy_sprite_render",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_ui_widgets",
    "bevy/bevy_gltf",
    "bevy/bevy_pbr",
    "bevy/bevy_animation",
    "bevy/bevy_gizmos",
    "bevy/bevy_gizmos_render",
    "bevy/bevy_scene",
    "bevy/x11",
    "bevy/wayland",
    "dep:bevy_render",
    "dep:bevy_ui_widgets",
    "passthrough-winit",
]
audio = ["bevy/bevy_audio", "dep:bevy_audio", "passthrough-winit"]
gamepad = ["bevy/gamepad", "bevy/bevy_gilrs", "dep:bevy_gilrs", "passthrough-winit"]
# Standalone winit passthrough for consumers that only need winit
# detection (not render/audio/gamepad).
passthrough-winit = ["dep:bevy_winit"]
deterministic-entropy = ["getrandom04"]
agent = ["bevy/bevy_remote", "bevy/bevy_render", "getrandom04"]

[dev-dependencies]
# le3.6 (RF2): parse every emitted JUnit document in tests
quick-xml = "0.42"
serial_test = "3"
# Z14 entropy tests: uuid uses getrandom 0.4 for v4 generation
uuid = { version = "1", features = ["v4", "rng-getrandom"] }
# rand acceptance test (ThreadRng via getrandom hook)
rand = "0.10"
# FX2: full draft-2020-12 validation of reports against the schema
jsonschema = { version = "0.30", default-features = false }
fixture-turn-based = { package = "fixture_turn_based", path = "fixtures/turn_based" }
fixture-walker = { package = "fixture_walker", path = "fixtures/walker" }
# FX7: e2e spawner-leak fingerprint test
fixture-spawner = { package = "fixture_spawner", path = "fixtures/spawner" }
# xd5: in-process fx0_gate sweep reuses fixture-runner's adapters
fixture-runner = { package = "fixture-runner", path = "tests/fixture-runner" }
fixture-lone = { package = "fixture_lone", path = "fixtures/lone" }
fixture-spinner = { package = "fixture_spinner", path = "fixtures/spinner" }
fixture-regression-pair = { package = "fixture_regression_pair", path = "fixtures/regression_pair" }

[badges]
maintenance = { status = "actively-developed" }
