[package]
name = "bevy_swarm_cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "cargo-swarm: CLI scaffolding for bevy_swarm playtests"

[[bin]]
name = "cargo-swarm"
path = "src/main.rs"

[dependencies]
bevy_swarm = { path = ".." }
serde = { workspace = true }
serde_json = { workspace = true }

jsonschema = { version = "0.30", default-features = false }

[dev-dependencies]
