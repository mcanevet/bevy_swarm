[package]
name = "fixture-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "In-process acceptance runner for bevy_playtest fixtures: adapter plugins + report writer"

[dependencies]
bevy_playtest = { path = "../.." }
bevy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fixture_spinner = { path = "../../fixtures/spinner" }
fixture_walker = { path = "../../fixtures/walker" }
fixture_spawner = { path = "../../fixtures/spawner" }
fixture_turn_based = { path = "../../fixtures/turn_based" }
fixture_regression_pair = { path = "../../fixtures/regression_pair" }
fixture_lone = { path = "../../fixtures/lone" }
fixture_multithread_panic = { path = "../../fixtures/multithread_panic" }

[[bin]]
name = "fixture-runner"
path = "src/main.rs"

[lib]
name = "fixture_runner"
path = "src/lib.rs"
