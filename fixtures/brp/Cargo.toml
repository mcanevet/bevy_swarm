[package]
name = "fixture_brp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fixture_brp"
test = false
bench = false

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["std", "bevy_remote", "bevy_winit", "bevy_window"] }

# Z20 fixture: bin-only, pure-Bevy. RemotePlugin + RemoteHttpPlugin
# expose BRP on 127.0.0.1:15702 for the external observe-only tier.
# `test = false` stops cargo/nextest from linking an unused test binary
# (see CI disk history on bead m2h.20).
