[package]
name = "fixture_bin_only_clean"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fixture_bin_only_clean"
test = false
bench = false

[dependencies]
bevy = { version = ">=0.19, <0.21", default-features = false, features = ["std"] }

# Z19: bin-only fixtures have no tests; `test = false` above stops
# cargo/nextest from linking an unused test binary (repeated CI lld
# SIGBUS flakes).
