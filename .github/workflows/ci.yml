name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Install Linux dependencies (bevy_render + winit backends)
        run: sudo apt-get update -yq && sudo apt-get install -yq --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 'Check the whole workspace (FX11: was root-package build only)'
        run: cargo check --workspace --all-targets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  features:
    runs-on: ubuntu-latest
    steps:
      - name: Install Linux dependencies (bevy_render + winit backends)
        run: sudo apt-get update -yq && sudo apt-get install -yq --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 'Assert default features pull no render/winit/audio crates (H2)'
        run: |
          # Crate-presence check: bevy feature names never matched the old
          # grep (bevy_render vs render). Check the crates directly.
          MATCHES=$(cargo tree -p bevy_swarm --no-default-features -e normal --prefix none | grep -cE '^(bevy_render|bevy_winit|bevy_audio|wgpu|winit|cpal) ' || true)
          if [ "$MATCHES" != "0" ]; then
            echo "FAIL: no-default-features pulls render/winit/audio crates"
            exit 1
          fi
      - name: 'Negative proof: the check fails when render IS enabled'
        run: |
          # Sanity-check the check itself: with --features render the grep
          # must find crates, and this step verifies that (expected fail).
          MATCHES=$(cargo tree -p bevy_swarm --no-default-features --features render -e normal --prefix none | grep -cE '^(bevy_render|bevy_winit|bevy_audio|wgpu|winit|cpal) ' || true)
          if [ "$MATCHES" = "0" ]; then
            echo "FAIL: negative control — check is vacuous, render crates not detected"
            exit 1
          fi

  hack:
    runs-on: ubuntu-latest
    steps:
      - name: Install Linux dependencies (bevy_render + winit backends)
        run: sudo apt-get update -yq && sudo apt-get install -yq --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 'Per-feature check (every feature alone)'
        run: cargo hack check --each-feature --no-dev-deps

  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Install Linux dependencies (bevy_render + winit backends)
        run: sudo apt-get update -yq && sudo apt-get install -yq --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build + test (agent feature)
        run: cargo test --features agent
      - name: Clippy (agent feature)
        run: cargo clippy --all-targets --features agent -- -D warnings

  entropy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (bevy_render + winit backends)
        run: sudo apt-get update -yq && sudo apt-get install -yq --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Deterministic entropy (getrandom custom backend)
        run: RUSTFLAGS='--cfg getrandom_backend="custom"' cargo test --features deterministic-entropy --test entropy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Linux dependencies (bevy_render + winit backends)
        run: sudo apt-get update -yq && sudo apt-get install -yq --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      
      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: 'Run all tests with nextest (FX11: workspace + all-features)'
        run: cargo nextest run --workspace --all-features
        env:
          CARGO_INCREMENTAL: "0"
      
      - name: 'Doc-tests (c5t: nextest does not run doc-tests)'
        run: cargo test --workspace --all-features --doc
        env:
          CARGO_INCREMENTAL: "0"
      
      - name: 'Lint with Clippy (deny warnings, FX11: workspace + all-features)'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          CARGO_INCREMENTAL: "0"
      
      - name: Build examples
        run: cargo build --examples --all-features
        env:
          CARGO_INCREMENTAL: "0"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies (bevy_render + winit backends)
        run: sudo apt-get update -yq && sudo apt-get install -yq --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps
