name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Linux dependencies
        run: sudo apt-get update -yq && sudo apt-get install -yq --no-install-recommends libudev-dev libasound2-dev libxcb-composite0-dev libwayland-dev
      
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Build
        run: cargo build --all-targets
      
      - name: Run unit tests
        run: cargo test --lib
      
      - name: Run benchmark tests (regression suite)
        run: cargo test --tests
      
      - name: Run doc tests
        run: cargo test --doc
