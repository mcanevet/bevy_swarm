name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - run: cargo build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Print enabled Bevy features (H2)
        run: cargo tree -e features -i bevy

  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Install Linux dependencies (bevy_render via agent feature)
        run: sudo apt-get update -yq && sudo apt-get install -yq --no-install-recommends libasound2-dev libudev-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + test (agent feature)
        run: cargo test --features agent
      - name: Clippy (agent feature)
        run: cargo clippy --all-targets --features agent -- -D warnings

  entropy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Deterministic entropy (getrandom custom backend)
        run: RUSTFLAGS='--cfg getrandom_backend="custom"' cargo test --features deterministic-entropy --test entropy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Build
        run: cargo build --all-targets
      
      - name: Run unit tests
        run: cargo test --lib
      
      - name: Run benchmark tests (regression suite)
        run: cargo test --tests
      
      - name: Run doc tests
        run: cargo test --doc
      
      - name: Lint with Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      
      - name: Build examples
        run: cargo build --examples

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps
