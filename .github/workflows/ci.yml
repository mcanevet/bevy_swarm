name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Build
        run: cargo build --all-targets
      
      - name: Run unit tests
        run: cargo test --lib
      
      - name: Run benchmark tests (regression suite)
        run: cargo test --tests
      
      - name: Run doc tests
        run: cargo test --doc
