[package]
name = "cargo-bevy-swarm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = true
description = "CLI scaffolding for bevy_swarm playtests — contract-driven bots, oracles, and crash minimization"
repository.workspace = true
rust-version = "1.97"
readme = "README.md"
keywords = ["bevy", "gamedev", "testing", "playtesting"]
categories = ["game-development", "development-tools::testing"]

[[bin]]
name = "cargo-bevy-swarm"
path = "src/main.rs"

[dependencies]
bevy_swarm = { path = "..", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }

jsonschema = { version = "0.30", default-features = false }

[dev-dependencies]
