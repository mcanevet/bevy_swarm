# cargo-deny configuration (MIT/Apache-2.0 dual licensing)

[advisories]
yanked = "warn"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
expression = "BSD-4-Clause"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
